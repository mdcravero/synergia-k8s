---
apiVersion: v1
kind: Namespace
metadata:
  name: agents
  labels:
    name: agents
---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  annotations:
    # Never let Flux delete this namespace, even if a Kustomization drops it:
    # it holds a whole app (pods, PVCs). It was declared in two Kustomizations
    # until 2026-10-19.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    name: metallb-system
    goldilocks.fairwinds.com/enabled: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  annotations:
    # Never let Flux delete this namespace, even if a Kustomization drops it:
    # it holds a whole app (pods, PVCs). It was declared in two Kustomizations
    # until 2026-10-19.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    name: traefik
    goldilocks.fairwinds.com/enabled: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: nfs-storage
  annotations:
    # Never let Flux delete this namespace, even if a Kustomization drops it:
    # it holds a whole app (pods, PVCs). It was declared in two Kustomizations
    # until 2026-10-19.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    name: nfs-storage
---
apiVersion: v1
kind: Namespace
metadata:
  name: tools
  labels:
    name: tools
    goldilocks.fairwinds.com/enabled: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: security
  labels:
    name: security
    goldilocks.fairwinds.com/enabled: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
  labels:
    name: media
    goldilocks.fairwinds.com/enabled: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    goldilocks.fairwinds.com/enabled: "true"
    # Added PodSecurity privileged labels to allow prometheus-node-exporter host access
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    name: cert-manager
    goldilocks.fairwinds.com/enabled: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: backup-system
  labels:
    name: backup-system
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    name: longhorn-system
    goldilocks.fairwinds.com/enabled: "true"
    # Longhorn runs privileged containers to manage disks and mount volumes;
    # Talos enforces "baseline" by default, which would block them.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: finance
  labels:
    name: finance
    goldilocks.fairwinds.com/enabled: "true"
    # Household finance data: strictest Pod Security level (apps here run non-root, read-only, no privileges)
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
  labels:
    name: cloudflared
    # The tunnel connector is the cluster's door to the internet: strictest
    # Pod Security level (non-root, read-only, no privileges).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
