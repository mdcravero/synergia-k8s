---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: sabnzbd
  name: sabnzbd
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      run: sabnzbd
  template:
    metadata:
      labels:
        run: sabnzbd
      annotations: {}
    spec:
      # linuxserver.io non-root mode (the image supports it): start as the
      # app user instead of root. PUID/PGID have no effect in this mode;
      # the uid/gid match them and /config's owner. s6 needs a writable /run
      # (the emptyDir below), and LSIO_NON_ROOT_USER selects the mode.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Argentina/Cordoba"
            # The image detects non-root mode from /run's owner, and an
            # emptyDir is always owned by root, so set the flag the
            # detection would set. Without it, init takes the root path
            # (usermod, chown, s6-setuidgid) and the app never starts.
            - name: LSIO_NON_ROOT_USER
              value: "1"
          image: lscr.io/linuxserver/sabnzbd:5.1.3
          name: sabnzbd
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1500m
              memory: 1Gi
          ports:
            - containerPort: 8080
              name: webui
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: run
              mountPath: /run
      volumes:
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: downloads
          persistentVolumeClaim:
            claimName: sabnzbd-down
