---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: maintainerr
  name: maintainerr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      run: maintainerr
  template:
    metadata:
      labels:
        run: maintainerr
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - env:
            - name: TZ
              value: "America/Argentina/Cordoba"
          image: maintainerr/maintainerr:3.30.1
          name: maintainerr
          resources:
            requests:
              cpu: 15m
              memory: 192Mi
            limits:
              # Was 50m: throttled up to 75% in short bursts (2026-10-14).
              cpu: 300m
              memory: 210Mi
          ports:
            - containerPort: 6246
              name: webui
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maintainerr-data
