---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: maintainerr
  name: maintainerr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      run: maintainerr
  template:
    metadata:
      labels:
        run: maintainerr
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - env:
            - name: TZ
              value: "America/Argentina/Cordoba"
          image: maintainerr/maintainerr:3.31.0
          name: maintainerr
          resources:
            requests:
              cpu: 15m
              memory: 192Mi
            # No CPU limit: it was throttled up to 75% at 50m and still up to 69%
            # at 300m (2026-10-14..17) while averaging a few millicores, which
            # is burst throttling that a higher limit does not fix. The
            # request still reserves its share.
            limits:
              memory: 210Mi
          ports:
            - containerPort: 6246
              name: webui
          volumeMounts:
            - name: data
              mountPath: /opt/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maintainerr-data
