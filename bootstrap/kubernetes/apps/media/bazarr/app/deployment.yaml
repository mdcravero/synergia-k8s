---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: bazarr
  name: bazarr
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      run: bazarr
  template:
    metadata:
      labels:
        run: bazarr
      annotations: {}
    spec:
      securityContext:
        # runAsUser: 1000
        # runAsGroup: 1000
        fsGroup: 1000
      containers:
        - env:
            - name: TZ
              value: Pacific/Auckland
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          image: linuxserver/bazarr:1.6.3-development
          name: bazarr
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              # Was 50m. On 2026-10-14 a sync job hit it, SignalR keepalives to
              # Sonarr/Radarr starved, and the reconnect bug ("socket is already
              # opened") piled up threads at 98-99.7% throttling until the 384Mi
              # memory limit OOM-killed the pod. Idle use is ~4m.
              cpu: 500m
              # 2026-10-14: VPA (Goldilocks) target ~259Mi, cAdvisor working set 222Mi of 280Mi.
              memory: 384Mi
          ports:
            - containerPort: 6767
              name: webui
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: bazarr-config
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
