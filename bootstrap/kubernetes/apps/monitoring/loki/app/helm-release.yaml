---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  chart:
    spec:
      chart: loki
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        # Defined in ../../alloy/app/helm-source.yaml.
        name: grafana-labs
      version: 7.7.0
  interval: 30m
  timeout: 10m
  releaseName: loki
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
      valuesKey: values.yaml
