apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-values
  namespace: monitoring
data:
  values.yaml: |-
    # Chart 28+: disable default scrapeConfigs map so scrape jobs are only those in serverFiles.prometheus.yml
    scrapeConfigs: null

    prometheus-pushgateway:
      enabled: true

    server:
      name: server

      # Time and size caps. The PVC lives on NFS, which does not enforce its 8Gi
      # size, so retentionSize is what keeps the TSDB from filling the shared
      # NFS disk. Usage was ~0.85 GiB for 15 days on 2026-10-14.
      retention: "15d"
      retentionSize: "6GB"

      persistentVolume:
        enabled: true
        storageClass: "nfs-client"
        accessModes:
          - ReadWriteOnce
        size: 8Gi

      env:
        - name: TZ
          value: "America/Argentina/Cordoba"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"

      # ClusterIP, not LoadBalancer: on the LAN it answered with no auth, and
      # with web.enable-lifecycle (needed by the localhost reload sidecar) any
      # host, IoT and Guest VLANs included, could POST /-/quit and stop
      # alerting. Grafana uses this Service; people use the Authelia-protected
      # ingress below.
      service:
        enabled: true
        annotations: {}
        type: ClusterIP
        servicePort: 80

      ingress:
        enabled: true
        pathType: Prefix
        hosts:
        - prometheus.synergia.net.ar
        path: /
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.middlewares: monitoring-middlewares-auth-prometheus@kubernetescrd

    kube-state-metrics:
      enabled: true

    prometheus-node-exporter:
      enabled: true
      extraArgs:
        - --collector.hwmon

      rbac:
        pspEnabled: false

      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000

      hostNetwork: false
      hostPort:
        enabled: false

      podSecurityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000

    serverFiles:
      prometheus.yml:
        rule_files:
          - /etc/config/recording_rules.yml
          - /etc/config/alerting_rules.yml
        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets: ['localhost:9090']
          - job_name: alertmanager
            static_configs:
              - targets: ['prometheus-alertmanager.monitoring.svc.cluster.local:9093']
          - job_name: traefik
            static_configs:
              - targets: ['traefik-metrics.traefik.svc.cluster.local:9100']
          - job_name: node-exporter
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - monitoring
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                action: keep
                regex: prometheus-node-exporter
              - source_labels: [__meta_kubernetes_pod_ip]
                replacement: $1:9100
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: instance
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
          - job_name: kube-state-metrics
            static_configs:
              - targets: ['prometheus-kube-state-metrics.monitoring.svc.cluster.local:8080']
          - job_name: pushgateway
            honor_labels: true
            static_configs:
              - targets: ['prometheus-prometheus-pushgateway.monitoring.svc.cluster.local:9091']
          - job_name: flux-system
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - flux-system
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                action: keep
                regex: (source-controller|kustomize-controller|helm-controller|notification-controller|image-automation-controller|image-reflector-controller)
              - source_labels: [__meta_kubernetes_pod_ip]
                replacement: $1:8080
                target_label: __address__
              - source_labels: [__meta_kubernetes_pod_label_app]
                target_label: instance
          # Grafana Alloy, the syslog receiver for the Omada network gear.
          # Exposes loki_source_syslog_entries_total and
          # loki_source_syslog_parsing_errors_total.
          - job_name: alloy
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - monitoring
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_name]
                action: keep
                regex: alloy;http-metrics
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: instance
          # Cilium agents and operator run on hostNetwork, so pod IP = node IP.
          # Keeping one container port per job gives one target per pod.
          - job_name: cilium-agent
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - kube-system
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_k8s_app, __meta_kubernetes_pod_container_port_number]
                action: keep
                regex: cilium;9962
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: instance
          - job_name: hubble
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - kube-system
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_k8s_app, __meta_kubernetes_pod_container_port_number]
                action: keep
                regex: cilium;9965
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: instance
          - job_name: cilium-operator
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - kube-system
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_io_cilium_app, __meta_kubernetes_pod_container_port_number]
                action: keep
                regex: operator;9963
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: instance
          # Per-container CPU and memory from each kubelet's cAdvisor, scraped
          # directly on :10250 with Prometheus' service account (RBAC
          # nodes/metrics). Only six metric families are kept, and pause and
          # pod-level series are dropped: a few hundred series in total.
          # insecure_skip_verify: synergia-05's kubelet serves a self-signed
          # certificate (no rotate-server-certificates there); the bearer
          # token still authenticates every request.
          - job_name: kubelet-cadvisor
            scheme: https
            metrics_path: /metrics/cadvisor
            authorization:
              credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            tls_config:
              insecure_skip_verify: true
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - source_labels: [__meta_kubernetes_node_name]
                target_label: instance
            metric_relabel_configs:
              - source_labels: [__name__]
                action: keep
                regex: container_(memory_working_set_bytes|memory_rss|spec_memory_limit_bytes|cpu_usage_seconds_total|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|oom_events_total)
              - source_labels: [container]
                action: drop
                regex: (|POD)
              - action: labeldrop
                regex: (id|image|name)
          - job_name: kubernetes-pods-tools
            scrape_interval: 2m
            scrape_timeout: 90s
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - tools
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                action: keep
                regex: true
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape_slow]
                action: drop
                regex: true
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
                action: replace
                target_label: __scheme__
                regex: (https?)
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                action: replace
                target_label: __metrics_path__
                regex: (.+)
              - source_labels: [__meta_kubernetes_pod_label_application]
                action: drop
                regex: spilo-logical-backup
              - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                action: replace
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $1:$2
                target_label: __address__
              - action: labelmap
                regex: __meta_kubernetes_pod_label_(.+)
              - source_labels: [__meta_kubernetes_namespace]
                action: replace
                target_label: kubernetes_namespace
              - source_labels: [__meta_kubernetes_pod_name]
                action: replace
                target_label: kubernetes_pod_name
          - job_name: desktop-pop-os
            # 15s en lugar del global de 1m: para forense de cuelgues la resolución
            # importa, y es un solo target.
            scrape_interval: 15s
            scrape_timeout: 10s
            static_configs:
              - targets: ['10.42.10.77:9100']
                labels:
                  instance: pop-os
                  node: pop-os
                  role: workstation

      recording_rules.yml:
        groups: []

      alerting_rules.yml:
        groups:
          - name: backups
            rules:
              - alert: BackupCronJobFailed
                expr: |
                  kube_job_failed{condition="true", job_name=~"(etcd-backup|homeassistant-backup)-.*"} == 1
                for: 0m
                labels:
                  severity: critical
                annotations:
                  summary: "Backup job {{ $labels.job_name }} failed"
                  description: "Job {{ $labels.job_name }} in namespace {{ $labels.namespace }} reached backoffLimit and is marked as failed."
              - alert: BackupCronJobNotScheduled
                expr: |
                  time() - kube_cronjob_status_last_schedule_time{cronjob=~"etcd-backup|homeassistant-backup"} > 90000
                for: 0m
                labels:
                  severity: warning
                annotations:
                  summary: "CronJob {{ $labels.cronjob }} has not run in 25h"
                  description: "CronJob {{ $labels.cronjob }} in namespace {{ $labels.namespace }} has not been scheduled in the last 25 hours. Check if it is suspended or if the cluster had an issue."
          - name: renovate
            rules:
              - alert: RenovateJobFailed
                expr: |
                  kube_job_failed{condition="true", job_name=~"renovate-.*"} == 1
                for: 0m
                labels:
                  severity: warning
                annotations:
                  summary: "Renovate job {{ $labels.job_name }} failed"
                  description: "Job {{ $labels.job_name }} in namespace {{ $labels.namespace }} reached backoffLimit. Check the token first: an expired github-token makes Renovate abort during initialization with a 401. Run: kubectl logs -n tools -l job-name={{ $labels.job_name }}"
              - alert: RenovateNoSuccessfulRun
                expr: |
                  time() - kube_cronjob_status_last_successful_time{cronjob="renovate"} > 172800
                for: 0m
                labels:
                  severity: warning
                annotations:
                  summary: "Renovate has not completed successfully in 48h"
                  description: "CronJob renovate has had no successful run in 48 hours. This catches the case where jobs keep running and failing, which the PR-based Telegram workflow cannot see because it only fires when a pull request is opened."
          - name: flux
            rules:
              - alert: FluxHelmReleaseFailed
                expr: |
                  gotk_reconcile_condition{type="Ready",status="False",kind="HelmRelease"} == 1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "HelmRelease {{ $labels.name }} failed"
                  description: "HelmRelease {{ $labels.name }} in namespace {{ $labels.namespace }} is not Ready. Run: flux get hr -n {{ $labels.namespace }}"
              - alert: FluxKustomizationFailed
                expr: |
                  gotk_reconcile_condition{type="Ready",status="False",kind="Kustomization"} == 1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Kustomization {{ $labels.name }} failed"
                  description: "Kustomization {{ $labels.name }} in namespace {{ $labels.namespace }} is not Ready. Run: flux get ks"
          - name: certificates
            rules:
              - alert: TalosConfigCertExpiringSoon
                expr: talos_client_cert_expiry_days < 7
                for: 0m
                labels:
                  severity: warning
                annotations:
                  summary: "talosconfig client cert expires in {{ $value }} days"
                  description: "Renew it: see bootstrap/kubernetes/apps/tools/backup/TALOSCONFIG-CERT-RENEWAL.md in synergia-k8s. Backups (etcd-backup) will start failing once it expires."
          - name: postgresql
            rules:
              - alert: PostgresqlExporterUnreachable
                expr: up{job="kubernetes-pods-tools",kubernetes_pod_name!~"logical-backup-.*|postgres-cluster-.*"} == 0
                for: 3m
                labels:
                  severity: critical
                annotations:
                  summary: "PostgreSQL exporter target is down"
                  description: "Prometheus cannot scrape postgres metrics in namespace tools (job kubernetes-pods-tools)."
              - alert: PostgresqlNotResponding
                expr: pg_up{job="kubernetes-pods-tools"} == 0
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "PostgreSQL not responding"
                  description: "postgres_exporter reports pg_up=0 for {{ $labels.instance }}."
              - alert: PostgresqlHighConnectionCount
                expr: |
                  sum by (instance, job) (
                    pg_stat_database_numbackends{job="kubernetes-pods-tools",datname!~"template.*"}
                  ) >= 35
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "PostgreSQL connection count high"
                  description: "Total backends across databases is {{ $value }} (cluster max_connections is 100) on {{ $labels.instance }}."
              # The postgres-cluster Service has no selector. With
              # PATRONI_KUBERNETES_USE_ENDPOINTS=true, Patroni writes its own pod
              # IP into the endpoint and rewrites it every cycle, so a manual
              # patch is reverted. After the 2026-10-02 power cut the pod
              # restarted in place with a new IP, but Patroni kept advertising
              # the old one (10.244.1.213) from about 15:45 to 17:00 UTC.
              # Authelia, n8n and Homebox crash-looped and SSO was down. The
              # likely cause is POD_IP from the downward API keeping its
              # pre-reboot value. The exporter connects over localhost, so the
              # other Postgres alerts saw nothing. Checked against 7 days of
              # history: it matches exactly that window and nothing else.
              - alert: PostgresqlMasterEndpointStale
                expr: |
                  (
                    kube_endpointslice_endpoints{namespace="tools", endpointslice=~"postgres-cluster-[a-z0-9]{5}"}
                      unless on (address)
                    label_replace(kube_pod_info{namespace="tools", pod=~"postgres-cluster-[0-9]+"}, "address", "$1", "pod_ip", "(.*)")
                  )
                  or
                  (
                    absent(kube_endpointslice_endpoints{namespace="tools", endpointslice=~"postgres-cluster-[a-z0-9]{5}"})
                      and on () (up{job="kube-state-metrics"} == 1)
                  )
                for: 10m
                labels:
                  severity: critical
                  instance: "tools/postgres-cluster"
                annotations:
                  summary: "postgres-cluster Service does not point at the Postgres pod"
                  description: "The endpoint address is '{{ $labels.address }}' (empty means no endpoint), and no postgres-cluster pod has that IP. Every app that uses Postgres (Authelia, n8n, Homebox, Home Assistant) times out, and Authelia down means SSO is down. Compare kubectl get endpoints -n tools postgres-cluster with kubectl get pod -n tools postgres-cluster-0 -o wide. Patching the endpoint does not stick, because Patroni rewrites it. Recreate the pod so it starts with a fresh POD_IP: kubectl delete pod -n tools postgres-cluster-0 (short DB outage)."
              # The HA recorder gives up after ~10 failed connection attempts at
              # startup and never retries, so HA keeps running with no history.
              # After the 2026-10-02 power cut HA started before Postgres was
              # ready and lost ~32h of history (14:41Z on 10-02 to 23:04Z on
              # 10-03) unnoticed. A working recorder always holds a connection to
              # the homeassistant database; pg_up guards against Postgres itself
              # being down, which PostgresqlNotResponding already covers.
              - alert: HomeAssistantRecorderDisconnected
                expr: |
                  sum(pg_stat_activity_count{datname="homeassistant"}) == 0
                    and on () (max(pg_up{job="kubernetes-pods-tools"}) == 1)
                for: 15m
                labels:
                  severity: critical
                  instance: "tools/home-assistant"
                annotations:
                  summary: "Home Assistant recorder is not connected to Postgres"
                  description: "No connections to the homeassistant database for 15 minutes while Postgres is up. Home Assistant is not saving history, and the lost data cannot be recovered. Usually the recorder gave up at startup because Postgres was not ready yet. Restart HA: kubectl -n tools rollout restart deployment/home-assistant"
          # Cluster nodes only: job="node-exporter" leaves out the pop-os
          # workstation, which is scraped by its own job and would otherwise
          # report a "reboot" every time the PC is switched on.
          - name: nodes
            rules:
              - alert: NodeFilesystemAlmostFull
                expr: |
                  (1 - node_filesystem_avail_bytes{job="node-exporter",mountpoint="/var"}
                     / node_filesystem_size_bytes{job="node-exporter",mountpoint="/var"}) * 100 > 80
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: "/var on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% full"
                  description: "/var (EPHEMERAL) holds container images, logs and, on the control-plane nodes, etcd. kubelet starts deleting unused images at 85% and evicts pods below 10% free. Unused images are the usual cause: list them with talosctl -n <ip> image list --namespace cri. kubelet's imageMaximumGCAge (168h) should keep them in check."
              - alert: NodeFilesystemCritical
                expr: |
                  (1 - node_filesystem_avail_bytes{job="node-exporter",mountpoint="/var"}
                     / node_filesystem_size_bytes{job="node-exporter",mountpoint="/var"}) * 100 > 90
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "/var on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% full"
                  description: "kubelet evicts pods below 10% free (DiskPressure), and an etcd member that runs out of space stops the control plane. Free space now: delete unused images or large pod logs on {{ $labels.instance }}."
              - alert: NodeRebooted
                expr: |
                  time() - node_boot_time_seconds{job="node-exporter"} < 900
                for: 0m
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.instance }} rebooted less than 15 minutes ago"
                  description: "Planned reboots (upgrades, migrations) fire this too. If the three RPi4s reboot together, suspect a power cut: check talosctl etcd members, kubectl get pods -A, and Cluster health in cilium-dbg status on each agent."
              - alert: NodeNotReady
                expr: |
                  kube_node_status_condition{condition="Ready",status="true"} == 0
                for: 5m
                labels:
                  severity: critical
                  # kube-state-metrics reports the node in "node"; "instance" is
                  # its own address. Copy the node name over so the Telegram
                  # message, which prints instance, says which node it is.
                  instance: "{{ $labels.node }}"
                annotations:
                  summary: "Node {{ $labels.node }} is NotReady"
                  description: "kubelet on {{ $labels.node }} has not reported Ready for 5 minutes. A planned reboot takes about 4 minutes, so this is longer than that. Check talosctl -n <ip> health and dmesg; on a control-plane node also check etcd members."
          - name: pods
            rules:
              # Restarts rather than the CrashLoopBackOff state: a crash-looping
              # pod alternates between Running and back-off, which would keep
              # resetting a "for" clause. Over 2026-09-26..10-03 this would have
              # fired only on real incidents: Jellyfin (PVC too small), OpenClaw
              # (2026.9 upgrade), Homarr (probes after a drain), and Authelia, n8n
              # and Homebox after the 2026-10-02 power cut.
              - alert: PodCrashLooping
                expr: |
                  max by (namespace, pod) (increase(kube_pod_container_status_restarts_total[15m])) >= 3
                for: 0m
                labels:
                  severity: warning
                  # One Telegram message per pod (Alertmanager groups by instance).
                  instance: "{{ $labels.namespace }}/{{ $labels.pod }}"
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | printf \"%.0f\" }} times in 15 minutes"
                  description: "Check Last State with kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}. OOMKilled means the memory limit. Exit 0 or 137 after \"Liveness probe failed\" events means the probe is too tight for the node. Otherwise read kubectl logs --previous. When several apps that use Postgres restart together, Postgres is the one to look at."

          - name: containers
            rules:
              # One OOM kill is enough to notify: PodCrashLooping needs three
              # restarts in 15 minutes. On 2026-10-13 Jellyfin was OOM-killed
              # once during a transcode and nothing alerted.
              - alert: ContainerOOMKilled
                expr: |
                  (max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}) == 1)
                    and on (namespace, pod, container)
                  (increase(kube_pod_container_status_restarts_total[15m]) > 0)
                for: 0m
                labels:
                  severity: warning
                  instance: "{{ $labels.namespace }}/{{ $labels.pod }}"
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOM-killed"
                  description: "The container hit its memory limit. Compare container_memory_rss with the limit around the kill, and raise the limit or find what spiked."
              # Both memory alerts use RSS (anonymous memory), not the working
              # set. The working set also counts active page cache, which the
              # kernel reclaims before it OOM-kills anything. A download client
              # fills any limit with the cache of the files it writes.
              # trans-movies "peaked" at 99.8% of 192Mi on 2026-10-27, but
              # Transmission itself held 9.5 MiB, the rest was cache, and it had
              # 0 OOM kills. None of the apps here use tmpfs (emptyDir medium
              # Memory), the one kind of file memory that is not reclaimable.
              - alert: ContainerMemoryNearLimit
                expr: |
                  max by (namespace, pod, container) (
                    container_memory_rss{job="kubelet-cadvisor"}
                      / (container_spec_memory_limit_bytes{job="kubelet-cadvisor"} > 0)
                  ) > 0.9
                for: 15m
                labels:
                  severity: warning
                  instance: "{{ $labels.namespace }}/{{ $labels.pod }}"
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) uses {{ $value | humanizePercentage }} of its memory limit"
                  description: "Above 90% for 15 minutes: the next spike may OOM-kill it. Check whether the usage is steady or still growing before raising the limit."
              # Early warning from the past week's peak, not the current value:
              # Jellyfin idled at ~500Mi of 900Mi and only a transcode start
              # crossed the limit. Grouped by container rather than pod, so a
              # restart does not reset the window. It keeps firing until the
              # limit is raised (or the peak ages out of the 7 days).
              # Goldilocks gave the same signal; see the memory note about
              # removing it once this has a few weeks of history.
              # A container stuck at its CPU limit stalls: Bazarr (50m) starved
              # its own SignalR keepalives on 2026-10-14, reconnect threads piled
              # up, and memory ran out 80 minutes later. This would have fired
              # about 50 minutes before that OOM kill.
              - alert: ContainerCPUThrottled
                expr: |
                  max by (namespace, container) (
                    rate(container_cpu_cfs_throttled_periods_total{job="kubelet-cadvisor"}[10m])
                      / rate(container_cpu_cfs_periods_total{job="kubelet-cadvisor"}[10m])
                  ) > 0.5
                for: 30m
                labels:
                  severity: warning
                  instance: "{{ $labels.namespace }}/{{ $labels.container }}"
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.container }} is CPU-throttled {{ $value | humanizePercentage }} of the time"
                  description: "Throttled in more than half of its CFS periods for 30 minutes: it keeps hitting its CPU limit and runs slowly, which can break timeouts and keepalives. Raise limits.cpu, or find what is busy."
              - alert: ContainerMemoryPeakNearLimit
                expr: |
                  max by (namespace, container) (max_over_time(container_memory_rss{job="kubelet-cadvisor"}[7d]))
                    / on (namespace, container)
                  max by (namespace, container) (container_spec_memory_limit_bytes{job="kubelet-cadvisor"} > 0)
                  > 0.9
                for: 1h
                labels:
                  severity: warning
                  instance: "{{ $labels.namespace }}/{{ $labels.container }}"
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.container }} peaked at {{ $value | humanizePercentage }} of its memory limit in the last 7 days"
                  description: "Not an outage yet: the next peak may OOM-kill it. Raise the memory limit above the peak plus a margin (container_memory_rss over 7d)."

          - name: cilium
            rules:
              # NetworkPolicies are enforced since 2026-10-13: a pod selected by
              # a policy loses any traffic its rules do not allow. A new or
              # changed policy, or a new client of a protected app, shows up here.
              # keep_firing_for merges bursts: drops come in waves (an app
              # retrying a blocked connection), and without it every wave
              # sent its own FIRING/RESOLVED pair to Telegram (2026-10-20).
              # Now a wave fires once, stays firing until an hour passes
              # without drops, and the warning route repeats it every 24h.
              - alert: CiliumPolicyDrops
                expr: |
                  sum by (instance) (increase(cilium_drop_count_total{reason="Policy denied"}[10m])) > 0
                for: 0m
                keep_firing_for: 1h
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.instance }}: Cilium is dropping traffic by policy ({{ $value | printf \"%.0f\" }} packets in the last 10 minutes when it fired)"
                  description: "A NetworkPolicy is denying traffic. hubble_drop_total{reason=~\"POLICY_DENIED|Policy denied\"} has the source and destination namespaces, and the Hubble UI or hubble observe --verdict DROPPED shows the flows. Fix the policy or the client. To stop dropping while debugging, set policyAuditMode: true in the cilium HelmRelease. Resolves after an hour without drops."
              - alert: CiliumNodeUnreachable
                expr: |
                  max by (instance) (cilium_unreachable_health_endpoints) > 0
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "{{ $labels.instance }}: Cilium cannot reach {{ $value }} other node(s)"
                  description: "Pod traffic between nodes is probably broken. Compare Cluster health in cilium-dbg status on every agent. A node that just rebooted settles within about 2 minutes."
              - alert: CiliumEndpointsNotReady
                expr: |
                  sum by (instance) (cilium_endpoint_state{endpoint_state!="ready"}) > 0
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.instance }}: {{ $value }} Cilium endpoints not ready for 15 minutes"
                  description: "Pods on this node may run with missing or stale network policy. Check cilium-dbg endpoint list and the logs of the node's cilium agent."
              - alert: CiliumAgentDown
                expr: |
                  up{job="cilium-agent"} == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "{{ $labels.instance }}: Cilium agent metrics unreachable for 5 minutes"
                  description: "Without its agent, new pods on this node get no network and policies are not updated. Check kubectl -n kube-system get pods -l k8s-app=cilium -o wide and the agent's logs."

          - name: syslog
            rules:
              # absent(... == 1) also fires when the target is gone entirely,
              # for example when the pod cannot be scheduled.
              - alert: AlloySyslogReceiverDown
                expr: |
                  absent(up{job="alloy"} == 1)
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Alloy, the syslog receiver for the Omada gear, is down"
                  description: "Logs from the Omada gateway, switches, access point and controller are not reaching Loki. UDP syslog is fire-and-forget, so they are lost, not queued. Check kubectl -n monitoring get pods -l app.kubernetes.io/name=alloy and its logs."
              - alert: OmadaSyslogParsingErrors
                expr: |
                  sum(increase(loki_source_syslog_parsing_errors_total{job="alloy"}[1h])) > 0
                for: 0m
                labels:
                  severity: warning
                annotations:
                  summary: "Alloy dropped {{ $value | printf \"%.0f\" }} syslog messages it could not parse in the last hour"
                  description: "The listener takes raw lines (syslog_format = raw in configmap-alloy.yaml), so this should not happen; a sender may be sending something that is not syslog at all. Alloy's own logs name the parse error."

    alertmanager:
      enabled: true
      persistence:
        enabled: true
        storageClass: "nfs-client"
        accessModes:
          - ReadWriteOnce
        size: 1Gi
      podSecurityContext:
        runAsUser: 65534
        runAsNonRoot: true
        runAsGroup: 65534
        fsGroup: 65534
      extraSecretMounts:
        - name: telegram-secret
          secretName: telegram-secret
          mountPath: /etc/alertmanager/secrets
          readOnly: true
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: telegram
          # instance splits per-node alerts into one message each. Without it,
          # three nodes rebooting together share a group, their summaries
          # differ, and the Telegram message (CommonAnnotations) comes out empty.
          group_by: ['alertname', 'namespace', 'instance']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 24h
          routes:
            - matchers:
                - severity = critical
              receiver: telegram
              repeat_interval: 4h
            - matchers:
                - severity = warning
              receiver: telegram
              repeat_interval: 24h
        receivers:
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/TELEGRAM_BOT_TOKEN
                chat_id_file: /etc/alertmanager/secrets/TELEGRAM_CHAT_ID
                message: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }} | {{ .CommonAnnotations.summary }}{{ if .CommonLabels.instance }} | instance={{ .CommonLabels.instance }}{{ end }}'
                send_resolved: true
