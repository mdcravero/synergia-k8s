apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-values
  namespace: monitoring
data:
  values.yaml: |-
    global:
      imageRegistry: null
      imagePullSecrets: []

    serviceAccount:
      create: true
      name: grafana-sa

    replicas: 1

    deploymentStrategy:
      type: RollingUpdate

    readinessProbe:
      httpGet:
        path: /api/health
        port: 3000

    livenessProbe:
      httpGet:
        path: /api/health
        port: 3000
      initialDelaySeconds: 60
      timeoutSeconds: 30
      failureThreshold: 10

    image:
      registry: docker.io
      repository: grafana/grafana
      tag: ""
      pullPolicy: IfNotPresent

    env: 
      PUID: 1000
      PGID: 1000
      TZ: "America/Argentina/Cordoba"

    persistence:
      enabled: true
      storageClassName: "nfs-client"
      accessModes:
        - ReadWriteOnce
      size: 5Gi

    initChownData:
      enabled: false

    admin:
      existingSecret: "secret-grafana"
      userKey: "admin-user"
      passwordKey: "admin-password"

    service:
      enabled: true
      type: LoadBalancer
      port: 80
      targetPort: 3000

    ingress:
      enabled: true
      pathType: Prefix
      hosts:
        - grafana.synergia.net.ar
      path: /
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"    

    tolerations: []

    affinity: {}

    nodeSelector:
      type: wk-amd

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ''
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
          - name: workstations
            orgId: 1
            folder: 'Workstations'
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/workstations

    dashboards:
      default:
        node-exporter-full:
          gnetId: 1860
          revision: 37
          datasource: Prometheus
        kubernetes-cluster:
          gnetId: 315
          revision: 3
          datasource: Prometheus
        # Postgres (the Zalando cluster's postgres-exporter sidecar). A new
        # file name on purpose: "postgresql.json" once held two dashboards
        # (9628, then 12485) and Grafana tangled them under one internal ID.
        postgresql-database:
          gnetId: 9628
          revision: 8
          datasource: Prometheus
        # Alertmanager's own health (notifications, silences, config
        # reloads); imported by hand on 2026-07-09 and now provisioned.
        alertmanager:
          gnetId: 9578
          revision: 4
          datasource: Prometheus
        # Isovalent's official Cilium dashboards; the metrics come from the
        # cilium-agent and hubble scrape jobs, which keep the pod and k8s_app
        # labels these dashboards filter on. The operator dashboard (16612)
        # is left out: most of its panels are for AWS ENI/EC2 IPAM.
        cilium-agent:
          gnetId: 16611
          revision: 1
          datasource: Prometheus
        hubble:
          gnetId: 16613
          revision: 1
          datasource: Prometheus
        # Log viewer for Loki ("Logs / App"). Dropped from this list by
        # mistake in 09fe3e5a; its file kept it alive on the Grafana PVC.
        loki-logs:
          gnetId: 13639
          revision: 2
          datasource: loki-home

        # Omada network syslog (Alloy -> Loki, plus Alloy's counters in
        # Prometheus). Built through the Grafana MCP on 2026-10-30.
        omada-network:
          json: |-
            {
              "annotations": {
                "list": [
                  {
                    "builtIn": 1,
                    "datasource": {
                      "type": "grafana",
                      "uid": "-- Grafana --"
                    },
                    "enable": true,
                    "hide": true,
                    "iconColor": "rgba(0, 211, 255, 1)",
                    "name": "Annotations & Alerts",
                    "type": "dashboard"
                  }
                ]
              },
              "editable": true,
              "fiscalYearStartMonth": 0,
              "graphTooltip": 0,
              "links": [],
              "panels": [
                {
                  "gridPos": {
                    "h": 4,
                    "w": 24,
                    "x": 0,
                    "y": 0
                  },
                  "id": 1,
                  "options": {
                    "content": "Syslog from the **Omada controller** (192.168.1.253), the **gateway** (10.42.20.1) and the switch, received by Grafana Alloy (`monitoring/alloy`, 10.42.20.45:514).\n\n- **Counts and graphs** come from Prometheus: Alloy counts lines as they arrive (`loki_process_custom_omada_*`, from 2026-10-30 18:52 UTC). They load instantly.\n- **Log panels and the top-sources table** read Loki (`{job=\"omada\"}`): they take longer over long ranges.\n- The firewall rules themselves live in the Omada controller (Network Config > ACL) and in the `synergia-omada` repo.",
                    "mode": "markdown"
                  },
                  "type": "text"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "PBFA97CFB590B2093"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "mappings": [
                        {
                          "options": {
                            "0": {
                              "color": "red",
                              "text": "Down"
                            },
                            "1": {
                              "color": "green",
                              "text": "Up"
                            }
                          },
                          "type": "value"
                        }
                      ],
                      "noValue": "Down",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "red"
                          },
                          {
                            "color": "green",
                            "value": 1
                          }
                        ]
                      }
                    },
                    "overrides": []
                  },
                  "gridPos": {
                    "h": 4,
                    "w": 6,
                    "x": 0,
                    "y": 4
                  },
                  "id": 2,
                  "options": {
                    "colorMode": "background",
                    "graphMode": "none",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "value"
                  },
                  "targets": [
                    {
                      "expr": "max(up{job=\"alloy\"})",
                      "instant": true,
                      "refId": "A"
                    }
                  ],
                  "title": "Syslog receiver",
                  "type": "stat"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "PBFA97CFB590B2093"
                  },
                  "description": "loki_source_syslog_entries_total over the selected range.",
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "fixedColor": "blue",
                        "mode": "fixed"
                      },
                      "decimals": 0
                    },
                    "overrides": []
                  },
                  "gridPos": {
                    "h": 4,
                    "w": 6,
                    "x": 6,
                    "y": 4
                  },
                  "id": 3,
                  "options": {
                    "colorMode": "value",
                    "graphMode": "none",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "value"
                  },
                  "targets": [
                    {
                      "expr": "sum(increase(loki_source_syslog_entries_total{job=\"alloy\"}[$__range]))",
                      "instant": true,
                      "refId": "A"
                    }
                  ],
                  "title": "Lines received",
                  "type": "stat"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "PBFA97CFB590B2093"
                  },
                  "description": "Lines Alloy dropped because they were not syslog. Should stay at 0.",
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "thresholds"
                      },
                      "decimals": 0,
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          {
                            "color": "green"
                          },
                          {
                            "color": "red",
                            "value": 1
                          }
                        ]
                      }
                    },
                    "overrides": []
                  },
                  "gridPos": {
                    "h": 4,
                    "w": 6,
                    "x": 12,
                    "y": 4
                  },
                  "id": 4,
                  "options": {
                    "colorMode": "value",
                    "graphMode": "none",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "value"
                  },
                  "targets": [
                    {
                      "expr": "sum(increase(loki_source_syslog_parsing_errors_total{job=\"alloy\"}[$__range]))",
                      "instant": true,
                      "refId": "A"
                    }
                  ],
                  "title": "Unparseable lines",
                  "type": "stat"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "PBFA97CFB590B2093"
                  },
                  "description": "Connections to Traefik (10.42.20.40) from outside Cloudflare that the gateway's WAN IN rule dropped in the selected range. Counted by Alloy since 2026-10-30 18:52 UTC.",
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "fixedColor": "orange",
                        "mode": "fixed"
                      },
                      "decimals": 0,
                      "noValue": "0"
                    },
                    "overrides": []
                  },
                  "gridPos": {
                    "h": 4,
                    "w": 6,
                    "x": 18,
                    "y": 4
                  },
                  "id": 5,
                  "options": {
                    "colorMode": "value",
                    "graphMode": "none",
                    "reduceOptions": {
                      "calcs": [
                        "lastNotNull"
                      ],
                      "fields": "",
                      "values": false
                    },
                    "textMode": "value"
                  },
                  "targets": [
                    {
                      "datasource": {
                        "type": "prometheus",
                        "uid": "PBFA97CFB590B2093"
                      },
                      "expr": "sum(increase(loki_process_custom_omada_firewall_blocks_total[$__range]))",
                      "instant": true,
                      "refId": "A"
                    }
                  ],
                  "title": "Blocked by the Traefik rule",
                  "type": "stat"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "PBFA97CFB590B2093"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "custom": {
                        "drawStyle": "bars",
                        "fillOpacity": 80,
                        "lineWidth": 1,
                        "stacking": {
                          "mode": "normal"
                        }
                      },
                      "decimals": 0
                    },
                    "overrides": []
                  },
                  "gridPos": {
                    "h": 8,
                    "w": 12,
                    "x": 0,
                    "y": 8
                  },
                  "id": 6,
                  "interval": "5m",
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom"
                    },
                    "tooltip": {
                      "mode": "multi"
                    }
                  },
                  "targets": [
                    {
                      "datasource": {
                        "type": "prometheus",
                        "uid": "PBFA97CFB590B2093"
                      },
                      "expr": "sum by (source_ip) (increase(loki_process_custom_omada_syslog_lines_total[$__interval]))",
                      "legendFormat": "{{source_ip}}",
                      "refId": "A"
                    }
                  ],
                  "title": "Log lines by sender",
                  "type": "timeseries"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "PBFA97CFB590B2093"
                  },
                  "fieldConfig": {
                    "defaults": {
                      "custom": {
                        "drawStyle": "bars",
                        "fillOpacity": 80,
                        "lineWidth": 1,
                        "stacking": {
                          "mode": "normal"
                        }
                      },
                      "decimals": 0
                    },
                    "overrides": []
                  },
                  "gridPos": {
                    "h": 8,
                    "w": 12,
                    "x": 12,
                    "y": 8
                  },
                  "id": 7,
                  "interval": "5m",
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom"
                    },
                    "tooltip": {
                      "mode": "multi"
                    }
                  },
                  "targets": [
                    {
                      "datasource": {
                        "type": "prometheus",
                        "uid": "PBFA97CFB590B2093"
                      },
                      "expr": "sum by (severity) (increase(loki_process_custom_omada_syslog_lines_total[$__interval]))",
                      "legendFormat": "{{severity}}",
                      "refId": "A"
                    }
                  ],
                  "title": "Log lines by severity",
                  "type": "timeseries"
                },
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "PFD47E6011A697DC0"
                  },
                  "gridPos": {
                    "h": 9,
                    "w": 14,
                    "x": 0,
                    "y": 16
                  },
                  "id": 8,
                  "options": {
                    "dedupStrategy": "none",
                    "enableLogDetails": true,
                    "showTime": true,
                    "sortOrder": "Descending",
                    "wrapLogMessage": true
                  },
                  "targets": [
                    {
                      "expr": "{job=\"omada\", source_ip=\"10.42.20.1\"} |= \"$search\"",
                      "refId": "A"
                    }
                  ],
                  "title": "Gateway lines (ACL drops, attack defense)",
                  "type": "logs"
                },
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "PFD47E6011A697DC0"
                  },
                  "description": "Public addresses the WAN IN rule blocked most in the selected range, by destination port.",
                  "gridPos": {
                    "h": 9,
                    "w": 10,
                    "x": 14,
                    "y": 16
                  },
                  "id": 10,
                  "options": {
                    "showHeader": true
                  },
                  "targets": [
                    {
                      "expr": "topk(15, sum by (src, dport) (count_over_time({job=\"omada\", source_ip=\"10.42.20.1\"} |= \"ACTION=Block\" | regexp \"SRC=(?P<src>[0-9.]+),DST.*Dport=(?P<dport>[0-9]+)\" [$__range])))",
                      "format": "table",
                      "queryType": "instant",
                      "refId": "A"
                    }
                  ],
                  "title": "Top blocked sources",
                  "transformations": [
                    {
                      "id": "organize",
                      "options": {
                        "excludeByName": {
                          "Time": true
                        },
                        "renameByName": {
                          "Value #A": "Blocks",
                          "dport": "Port",
                          "src": "Source"
                        }
                      }
                    },
                    {
                      "id": "sortBy",
                      "options": {
                        "sort": [
                          {
                            "desc": true,
                            "field": "Blocks"
                          }
                        ]
                      }
                    }
                  ],
                  "type": "table"
                },
                {
                  "datasource": {
                    "type": "loki",
                    "uid": "PFD47E6011A697DC0"
                  },
                  "gridPos": {
                    "h": 14,
                    "w": 24,
                    "x": 0,
                    "y": 25
                  },
                  "id": 9,
                  "options": {
                    "dedupStrategy": "none",
                    "enableLogDetails": true,
                    "showTime": true,
                    "sortOrder": "Descending",
                    "wrapLogMessage": true
                  },
                  "targets": [
                    {
                      "expr": "{job=\"omada\"} |= \"$search\"",
                      "refId": "A"
                    }
                  ],
                  "title": "All Omada logs",
                  "type": "logs"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "PBFA97CFB590B2093"
                  },
                  "description": "WAN IN drops per 5 minutes, by destination port, counted by Alloy.",
                  "fieldConfig": {
                    "defaults": {
                      "color": {
                        "mode": "palette-classic"
                      },
                      "custom": {
                        "drawStyle": "bars",
                        "fillOpacity": 80,
                        "lineWidth": 1,
                        "stacking": {
                          "mode": "normal"
                        }
                      },
                      "decimals": 0
                    },
                    "overrides": []
                  },
                  "gridPos": {
                    "h": 7,
                    "w": 24,
                    "x": 0,
                    "y": 16
                  },
                  "id": 11,
                  "interval": "5m",
                  "options": {
                    "legend": {
                      "displayMode": "list",
                      "placement": "bottom"
                    },
                    "tooltip": {
                      "mode": "multi"
                    }
                  },
                  "targets": [
                    {
                      "datasource": {
                        "type": "prometheus",
                        "uid": "PBFA97CFB590B2093"
                      },
                      "expr": "sum by (dport) (increase(loki_process_custom_omada_firewall_blocks_total[$__interval]))",
                      "legendFormat": "port {{dport}}",
                      "refId": "A"
                    }
                  ],
                  "title": "Firewall blocks by port",
                  "type": "timeseries"
                }
              ],
              "refresh": "5m",
              "schemaVersion": 42,
              "tags": [
                "omada",
                "network",
                "syslog"
              ],
              "templating": {
                "list": [
                  {
                    "current": {
                      "text": "",
                      "value": ""
                    },
                    "hide": 0,
                    "label": "Search logs (text)",
                    "name": "search",
                    "query": "",
                    "type": "textbox"
                  }
                ]
              },
              "time": {
                "from": "now-6h",
                "to": "now"
              },
              "timepicker": {},
              "timezone": "browser",
              "title": "Omada Network",
              "uid": "omada-network",
              "weekStart": ""
            }

      workstations:
        freeze-forensics:
          datasource: Prometheus
          json: |-
            {
              "title": "Workstation Freeze Forensics",
              "uid": "workstation-freeze-forensics",
              "tags": ["workstation", "node-exporter"],
              "timezone": "browser",
              "schemaVersion": 39,
              "version": 1,
              "editable": true,
              "refresh": "30s",
              "time": { "from": "now-6h", "to": "now" },
              "templating": {
                "list": [
                  {
                    "name": "instance",
                    "type": "query",
                    "datasource": "Prometheus",
                    "query": "label_values(up{role=\"workstation\"}, instance)",
                    "refresh": 2,
                    "includeAll": false,
                    "multi": false,
                    "sort": 1
                  }
                ]
              },
              "panels": [
                {
                  "id": 1,
                  "title": "Up",
                  "type": "stat",
                  "datasource": "Prometheus",
                  "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
                  "targets": [
                    { "expr": "up{instance=\"$instance\"}", "legendFormat": "up", "refId": "A" }
                  ],
                  "fieldConfig": {
                    "defaults": {
                      "mappings": [
                        { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
                      ],
                      "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "red" }, { "value": 1, "color": "green" } ] }
                    }
                  }
                },
                {
                  "id": 2,
                  "title": "Load average",
                  "type": "timeseries",
                  "datasource": "Prometheus",
                  "gridPos": { "x": 6, "y": 0, "w": 18, "h": 4 },
                  "targets": [
                    { "expr": "node_load1{instance=\"$instance\"}", "legendFormat": "load1", "refId": "A" },
                    { "expr": "node_load5{instance=\"$instance\"}", "legendFormat": "load5", "refId": "B" },
                    { "expr": "node_load15{instance=\"$instance\"}", "legendFormat": "load15", "refId": "C" }
                  ]
                },
                {
                  "id": 3,
                  "title": "PSI - some (waiting)",
                  "description": "Fraction of time at least one task was stalled waiting on this resource. Earliest signal of an oncoming freeze.",
                  "type": "timeseries",
                  "datasource": "Prometheus",
                  "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
                  "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 } },
                  "targets": [
                    { "expr": "rate(node_pressure_cpu_waiting_seconds_total{instance=\"$instance\"}[1m])", "legendFormat": "cpu", "refId": "A" },
                    { "expr": "rate(node_pressure_memory_waiting_seconds_total{instance=\"$instance\"}[1m])", "legendFormat": "memory", "refId": "B" },
                    { "expr": "rate(node_pressure_io_waiting_seconds_total{instance=\"$instance\"}[1m])", "legendFormat": "io", "refId": "C" }
                  ]
                },
                {
                  "id": 4,
                  "title": "PSI - full (stalled)",
                  "description": "Fraction of time ALL tasks were stalled on this resource simultaneously. No CPU variant by definition.",
                  "type": "timeseries",
                  "datasource": "Prometheus",
                  "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
                  "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 } },
                  "targets": [
                    { "expr": "rate(node_pressure_memory_stalled_seconds_total{instance=\"$instance\"}[1m])", "legendFormat": "memory", "refId": "A" },
                    { "expr": "rate(node_pressure_io_stalled_seconds_total{instance=\"$instance\"}[1m])", "legendFormat": "io", "refId": "B" }
                  ]
                },
                {
                  "id": 5,
                  "title": "Temperatures (hwmon)",
                  "type": "timeseries",
                  "datasource": "Prometheus",
                  "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
                  "fieldConfig": { "defaults": { "unit": "celsius" } },
                  "targets": [
                    { "expr": "node_hwmon_temp_celsius{instance=\"$instance\"}", "legendFormat": "{{chip}} {{sensor}}", "refId": "A" }
                  ]
                },
                {
                  "id": 6,
                  "title": "GPU busy % (textfile collector)",
                  "description": "Only populated on hosts running the freeze-watch textfile collector for amdgpu.",
                  "type": "timeseries",
                  "datasource": "Prometheus",
                  "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
                  "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } },
                  "targets": [
                    { "expr": "amdgpu_busy_percent{instance=\"$instance\"}", "legendFormat": "{{card}}", "refId": "A" }
                  ]
                },
                {
                  "id": 7,
                  "title": "Memory available",
                  "type": "timeseries",
                  "datasource": "Prometheus",
                  "gridPos": { "x": 0, "y": 20, "w": 24, "h": 8 },
                  "fieldConfig": { "defaults": { "unit": "bytes" } },
                  "targets": [
                    { "expr": "node_memory_MemAvailable_bytes{instance=\"$instance\"}", "legendFormat": "available", "refId": "A" },
                    { "expr": "node_memory_MemTotal_bytes{instance=\"$instance\"}", "legendFormat": "total", "refId": "B" }
                  ]
                }
              ]
            }

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
        - access: proxy
          basicAuth: false
          isDefault: false
          jsonData:
            maxLines: 1000
            timeout: 60
            alerting: false
            queryType: "range"
            metrics: true
            logs: true
          name: Prometheus
          type: prometheus
          url: http://prometheus-server:80
        - access: proxy
          basicAuth: false
          isDefault: true
          jsonData:
            maxLines: 1000
            timeout: 60
            alerting: false
            queryType: "range"
            metrics: false
            logs: true
          name: loki-home
          type: loki
          url: http://loki-stack:3100