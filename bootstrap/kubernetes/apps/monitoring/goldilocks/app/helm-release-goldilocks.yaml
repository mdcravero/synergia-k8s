---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: monitoring
spec:
  interval: 1h
  dependsOn:
    - name: vpa
  chart:
    spec:
      chart: goldilocks
      version: "11.2.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: monitoring
  values:
    dashboard:
      replicaCount: 1
      service:
        type: ClusterIP
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    controller:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        # No CPU limit. It averages ~30m but runs in bursts across every core
        # (Go), so even 250m left it ~73% throttled with plenty of quota
        # unused. A higher limit does not fix that. The request still reserves
        # its share. Goldilocks is due for removal around 2026-11-11.
        limits:
          memory: 128Mi
