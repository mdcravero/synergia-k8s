---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
  namespace: monitoring
spec:
  interval: 1h
  dependsOn:
    - name: vpa
  chart:
    spec:
      chart: goldilocks
      version: "11.2.0"
      sourceRef:
        kind: HelmRepository
        name: fairwinds-stable
        namespace: monitoring
  values:
    dashboard:
      replicaCount: 1
      service:
        type: ClusterIP
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
    controller:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          # Was 100m: throttled ~85% for 30 minutes and more (2026-10-14),
          # which would keep ContainerCPUThrottled firing.
          cpu: 250m
          memory: 128Mi
