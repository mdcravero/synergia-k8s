---
# Read-only access to pods, the only Kubernetes API use of alloy-logs
# (discovery.kubernetes with role = "pod"). Replaces the Alloy chart's
# default ClusterRole, which also reads every Secret and ConfigMap.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-logs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-logs
subjects:
  - kind: ServiceAccount
    # Created by the chart from the release name.
    name: alloy-logs
    namespace: monitoring
