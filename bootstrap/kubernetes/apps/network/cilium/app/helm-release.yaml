---
# Cilium, the cluster's CNI. Installed by hand with Helm on 2026-09-28 for the
# flannel migration (MIGRATION-FROM-FLANNEL.md) and adopted by Flux in Phase
# 6.3: a HelmRelease whose release name and namespace match an existing release
# upgrades that release instead of installing a new one.
#
# Never delete this HelmRelease and never change releaseName: helm-controller
# would uninstall Cilium, which takes down all pod networking. The prune
# annotation keeps Flux from deleting it if it disappears from Git. To stop
# reconciling, suspend it.
#
# Values started as a verbatim copy of the migration's helm-values-migration.yaml
# (identical to the live release on 2026-10-12; removed in Phase 6.7, last in
# commit 6d8a68a0). Phase 6.4 then took Cilium out of
# migration mode: it writes its own CNI config, and policies are evaluated in
# audit mode.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  releaseName: cilium
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: cilium
      version: 1.20.2
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 12h
  upgrade:
    remediation:
      retries: 1
      remediateLastFailure: true
      strategy: rollback
  values:
    # --- IPAM and overlay -----------------------------------------------------
    # One /24 per node out of 10.245.0.0/16, allocated by the Cilium operator.
    # The range dates from the migration, when flannel held 10.244.0.0/16. Talos'
    # cluster.network.podSubnets still says 10.244.0.0/16; cluster-pool IPAM
    # does not use it.
    ipam:
      mode: cluster-pool
      operator:
        clusterPoolIPv4PodCIDRList:
          - "10.245.0.0/16"
        clusterPoolIPv4MaskSize: 24

    # Restart pods that Cilium does not manage (no CiliumEndpoint), so a pod
    # can never be left on a stale network. It was off during the migration to
    # leave flannel's pods alone.
    operator:
      unmanagedPodWatcher:
        restart: true

    # VXLAN on Cilium's default port. Pinned rather than left to a chart
    # default: changing the tunnel port on a live cluster is disruptive. (During
    # the migration flannel ran alongside on 4789.)
    routingMode: tunnel
    tunnelProtocol: vxlan
    tunnelPort: 8472

    # NetworkPolicies are enforced: a pod selected by a policy only gets the
    # traffic its rules allow, and pods without a policy stay allow-all. Audit
    # mode ran from 2026-10-12 to 2026-10-13 with no AUDIT verdicts (Phase 6.6
    # of MIGRATION-FROM-FLANNEL.md). To debug a suspected policy drop, set
    # policyAuditMode back to true and restart the agents.
    policyEnforcementMode: "default"
    policyAuditMode: false

    # eBPF host routing needs kube-proxy replacement, which is not enabled.
    bpf:
      hostLegacyRouting: true

    # Cilium writes its own CNI config (05-cilium.conflist) and is the only CNI
    # on the nodes. During the migration a CiliumNodeConfig did this per node.
    # uninstall: false keeps a restarting agent from deleting the conflist,
    # which would leave new pods on that node without networking.
    cni:
      customConf: false
      uninstall: false

    # --- Hubble ------------------------------------------------------------------
    # The agents' Hubble server is on by default (port 4244). Relay gathers flows
    # from all four agents, and the UI draws the service map from them. The UI
    # has no login of its own: ingress.yaml puts it behind Authelia (two_factor,
    # group admins only), because it shows every flow in the cluster.
    hubble:
      relay:
        enabled: true
      ui:
        enabled: true

    # --- Talos requirements ---------------------------------------------------
    # Talos provides cgroupv2 and bpffs itself; letting Cilium mount them fails.
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Talos refuses to let workloads load kernel modules, so SYS_MODULE must be
    # dropped. The rest is the capability set Cilium needs to function.
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # NIC names are not uniform here: end0 on the three RPi4 nodes, enp2s0 on the
    # Radxa. Each agent binds whichever of these exists on its node and ignores the
    # rest. Cilium would usually auto-detect the device holding the default route,
    # so this is defensive rather than required today — but it becomes load-bearing
    # in Phase 6 if kubeProxyReplacement is turned on, and an unlisted NIC fails
    # silently rather than loudly.
    devices: "end0 enp2s0"

    # KubePrism, already enabled on this cluster at 127.0.0.1:7445. Reaching the API
    # server through it keeps Cilium working even while the CNI underneath it is
    # being swapped.
    k8sServiceHost: localhost
    k8sServicePort: 7445

    # --- Stay out of MetalLB's way --------------------------------------------
    # MetalLB owns LoadBalancer IPs on this cluster: L2 mode, pool
    # 10.42.20.40-10.42.20.90, 14 services. Its speakers run on hostNetwork, so they
    # announce ARP on the real NIC and are unaffected by the CNI swap.
    #
    # Cilium ships enableLBIPAM=true by default. It is inert without a
    # CiliumLoadBalancerIPPool, but leaving it on means the first such pool anyone
    # creates puts two controllers in charge of the same service IPs. Both are
    # pinned off explicitly rather than left to a chart default.
    enableLBIPAM: false
    l2announcements:
      enabled: false

    # --- Deliberately NOT set -------------------------------------------------
    # kubeProxyReplacement: kube-proxy stays for now. Replacing it is a separate
    # change with its own failure modes; stacking it on the CNI swap makes any
    # breakage ambiguous. Revisit once every node is on Cilium.
