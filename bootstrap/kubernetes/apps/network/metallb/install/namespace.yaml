---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  annotations:
    # Never let Flux delete this namespace, even if a Kustomization drops it:
    # it holds a whole app (pods, PVCs). It was declared in two Kustomizations
    # until 2026-10-19.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    name: metallb-system
    goldilocks.fairwinds.com/enabled: "true"
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged