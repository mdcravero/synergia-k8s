---
# Cloudflare Tunnel connector. cloudflared dials out to Cloudflare's edge and
# carries the public hostnames' traffic back in through that connection, so
# the router needs no open port: the origin is unreachable except through
# Cloudflare. The tunnel is remotely managed: its routes live in the
# Cloudflare dashboard, and the only one is *.synergia.net.ar -> Traefik.
# Host routing stays in Traefik (and in Git). See README.md for the cutover.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  # Two connectors on different nodes: the tunnel stays up through a node
  # reboot. Each one opens its own connections to the edge.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cloudflared
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0
          imagePullPolicy: IfNotPresent
          # No auto-update: Renovate bumps the tag. /ready answers 200 once at
          # least one connection to the edge is up.
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-tunnel
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
          # Requests-only CPU: Go burst-throttles under a CFS limit.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
