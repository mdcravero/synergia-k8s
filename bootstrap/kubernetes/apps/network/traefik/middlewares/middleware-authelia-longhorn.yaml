---
# Authelia forward-auth for the Longhorn UI. Authelia's access_control requires
# two_factor for longhorn.synergia.net.ar: the UI has no login of its own and
# can delete every volume.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: middlewares-auth-longhorn
  namespace: longhorn-system
spec:
  forwardAuth:
    address: "http://authelia.security.svc.cluster.local/api/authz/forward-auth"
    trustForwardHeader: true
    authResponseHeaders:
      - "Remote-User"
      - "Remote-Groups"
      - "Remote-Email"
      - "Remote-Name"
