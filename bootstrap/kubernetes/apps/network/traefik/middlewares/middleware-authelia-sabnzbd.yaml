---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: middlewares-auth-sabnzbd
  namespace: media
spec:
  forwardAuth:
    address: "http://authelia.security.svc.cluster.local/api/authz/forward-auth"
    trustForwardHeader: true
    # Authelia answers with a short redirect or 401 body; cap it instead of
    # the unlimited default (Traefik 3.8 warns about it).
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - "Remote-User"
      - "Remote-Groups"
      - "Remote-Email"
      - "Remote-Name"
      - "Remote-Given-Name"
      - "Remote-Family-Name"
