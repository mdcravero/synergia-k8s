---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-values
  namespace: traefik
data:
  values.yaml: |-

    # INFO, not DEBUG: DEBUG logs every router and middleware decision for
    # internet-facing traffic, a lot of volume in Loki for no daily use.
    # Switch back temporarily when debugging routing.
    log:
      level: INFO

    accessLog:
      enabled: true
      format: json
    
    metrics:
      prometheus:
        service:
          enabled: true
          labels: {}
          annotations: {}
        serviceMonitor:
          enabled: false


    additionalArguments:
      - "--api.insecure=false"
      - "--api.dashboard=true"
      # Traefik 3.8 warns about both settings below until they are explicit.
      # Drop request headers whose names alias another header (Remote_User,
      # Remote.User for Remote-User). ForwardAuth only manages the canonical
      # Remote-* headers it sets from Authelia, so a backend that normalizes
      # header names could otherwise read a client-forged identity. Applies
      # to every entry point (web, websecure, traefik).
      - "--global.aliasHeadersStrategy=delete"
      # Keep the legacy router/service names: they are the labels in the
      # Traefik metrics and dashboards, and Ingress annotations reference
      # middlewares as namespace-name@kubernetescrd. true would rename them.
      - "--providers.kubernetescrd.safeNaming=false"

    providers:
      kubernetesCRD: 
        allowExternalNameServices: true

      kubernetesIngress:
        allowExternalNameServices: true

    persistence:
      enabled: true
      storageClass: "nfs-client"
      accessModes:
        - ReadWriteOnce
      size: 128Mi

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 256Mi

    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

    service:
      enabled: true
      single: true
      # The chart reads the type from spec; a top-level service.type was
      # never a chart value, and chart 42.3.1's schema rejects it.
      spec:
        type: LoadBalancer
        loadBalancerIP: "10.42.20.40"

    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
          - websecure
        matchRule:  Host(`traefik-dash.synergia.net.ar`)
        host: traefik.synergia.net.ar
        pathPrefix: /dashboard
        services:
          - name: api@internal
            kind: TraefikService
        middlewares: 
          - name: "middlewares-authelia"
            namespace: traefik
