---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  annotations:
    # Never let Flux delete this namespace, even if a Kustomization drops it:
    # it holds a whole app (pods, PVCs). It was declared in two Kustomizations
    # until 2026-10-19.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    name: traefik
    goldilocks.fairwinds.com/enabled: "true"