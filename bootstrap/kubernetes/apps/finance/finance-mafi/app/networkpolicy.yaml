# Nothing in the finance namespace accepts traffic unless a policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: finance
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The app trusts the Remote-* headers set by Authelia via Traefik:
# only Traefik may reach the pod (kubelet probes come from the host and are allowed by Cilium).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-mafi
  namespace: finance
spec:
  podSelector:
    matchLabels:
      app: finance-mafi
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 8080
          protocol: TCP
