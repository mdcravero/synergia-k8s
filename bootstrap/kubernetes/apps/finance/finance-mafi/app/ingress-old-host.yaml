# finance.synergia.net.ar was Finance MaFi's first address. With two finance apps (finance-matute is
# wallet.synergia.net.ar) it moved to mafi.synergia.net.ar; the old address only redirects there, so
# bookmarks and the installed app keep working. Temporary (302): remove once nobody uses it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: finance-mafi-old-host
  namespace: finance
spec:
  redirectRegex:
    regex: ^https?://finance\.synergia\.net\.ar/(.*)
    replacement: https://mafi.synergia.net.ar/${1}
    permanent: false
---
# Traefik answers the redirect itself: nothing reaches the pod, so no Authelia here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-mafi-old-host
  namespace: finance
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: finance-finance-mafi-old-host@kubernetescrd
spec:
  rules:
    - host: finance.synergia.net.ar
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance-mafi
                port:
                  number: 8080
---
# Except /sw.js, which reaches the app. Browsers that opened v0.2.0 here keep its service worker, which
# answers every visit from its cache, so they never reach the redirect; and a redirected /sw.js cannot
# replace it. With RETIRED_HOSTS the app answers this address's /sw.js with a worker that clears the
# cache, unregisters itself and reloads, and then the redirect works. Public: it is a fixed script, no data.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-mafi-old-host-sw
  namespace: finance
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Traefik ranks routers by rule length, and Path(`/sw.js`) is one character shorter than the redirect's
    # PathPrefix(`/`): without this the redirect wins and /sw.js never reaches the app.
    traefik.ingress.kubernetes.io/router.priority: "1000"
spec:
  rules:
    - host: finance.synergia.net.ar
      http:
        paths:
          - path: /sw.js
            pathType: Exact
            backend:
              service:
                name: finance-mafi
                port:
                  number: 8080
