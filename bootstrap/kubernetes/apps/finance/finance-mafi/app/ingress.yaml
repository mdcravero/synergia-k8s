# Exposed through Traefik with Authelia (two_factor, group "finance").
# The strip middleware runs first so a client can never send its own Remote-* identity headers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-mafi-ingress
  namespace: finance
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: finance-finance-mafi-strip-remote@kubernetescrd,finance-middlewares-auth-finance-mafi@kubernetescrd
spec:
  rules:
    - host: finance.synergia.net.ar
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance-mafi
                port:
                  number: 8080
