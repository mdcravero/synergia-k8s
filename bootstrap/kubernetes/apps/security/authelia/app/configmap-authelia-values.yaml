---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-values
  namespace: security
data:
  values.yaml: |-
    enabled: true

    secret:
      existingSecret: secret-authelia
      additionalSecrets:
        secret-authelia:
          items:
            - key: issuer_private.pem
              path: issuer_private.pem

    rbac:
      enabled: true

    pod:
      kind: Deployment
      replicas: 1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      extraVolumes:
        # SOPS-encrypted Secret from apps/secrets (secret-authelia-users.yaml).
        - name: users-database
          secret:
            secretName: authelia-users
      extraVolumeMounts:
        - name: users-database
          mountPath: /config/users_database.yml
          subPath: users_database.yml

    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
      tls:
        enabled: false

    configMap:
      disabled: false
      server:
        endpoints:
          authz:
            forward-auth:
              implementation: ForwardAuth
      session:
        cookies:
          - domain: synergia.net.ar
            subdomain: auth
        same_site: lax
      authentication_backend:
        file:
          enabled: true
          path: /config/users_database.yml
      access_control:
        default_policy: deny
        # A rule without a subject matches every signed-in user, and
        # default_policy only applies when no rule matches the domain. So every
        # admin UI names its group: without it, a user who only belongs to
        # "finance" could open all of them.
        rules:
          - domain: auth.synergia.net.ar
            policy: one_factor
          - domain: traefik-dash.synergia.net.ar
            policy: one_factor
            subject:
              - group:admins
          - domain: prometheus.synergia.net.ar
            policy: one_factor
            subject:
              - group:admins
          - domain: maintainerr.synergia.net.ar
            policy: one_factor
            subject:
              - group:admins
          - domain: goldilocks.synergia.net.ar
            policy: one_factor
            subject:
              - group:admins
          - domain: zigbee2mqtt.synergia.net.ar
            policy: one_factor
            subject:
              - group:admins
          - domain: openclaw.synergia.net.ar
            policy: one_factor
            subject:
              - group:admins
          - domain: sabnzbd.synergia.net.ar
            policy: one_factor
            subject:
              - group:admins
          # Longhorn's UI and API have no authentication of their own and can
          # delete every volume, and every subdomain here reaches Traefik from
          # the internet through Cloudflare. Password alone is not enough.
          - domain: longhorn.synergia.net.ar
            policy: two_factor
            subject:
              - group:admins
          # Hubble UI: every network flow in the cluster, no login of its own.
          - domain: hubble.synergia.net.ar
            policy: two_factor
            subject:
              - group:admins
          # Finance MaFi: household finances, only the "finance" group, always with 2FA
          - domain: finance.synergia.net.ar
            policy: two_factor
            subject:
              - group:finance
      storage:
        postgres:
          enabled: true
          address: tcp://postgres-cluster.tools.svc.cluster.local:5432
          database: authelia
          username: authelia_user
          tls:
            enabled: true
            skip_verify: true
      notifier:
        disable_startup_check: true
        filesystem:
          enabled: true
      identity_providers:
        oidc:
          enabled: true
          cors:
            allowed_origins_from_client_redirect_uris: true
          jwks:
            - key_id: default
              algorithm: RS256
              use: sig
              key:
                path: /secrets/secret-authelia/issuer_private.pem
          clients:
            - client_id: homebox
              client_name: Homebox
              client_secret: '$pbkdf2-sha512$310000$G0x0JEzoQ8oyoDyUi5sQcQ$Wu2u6b9Fdvsf8Is/tjbM8rj2jeyI4POddgGCEOqUyuSW.zDSpEJGVpXnT32T6p7uRgGNw2XRYDN0iTmApBaxUQ'
              public: false
              authorization_policy: one_factor
              require_pkce: true
              pkce_challenge_method: S256
              redirect_uris:
                - https://homebox.synergia.net.ar/api/v1/users/login/oidc/callback
              scopes:
                - openid
                - profile
                - email
                - groups
              response_types:
                - code
              grant_types:
                - authorization_code
              token_endpoint_auth_method: client_secret_basic