---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: agents
data:
  openclaw.json: |
    {
      gateway: {
        mode: "local",
        auth: {
          mode: "token",
        },
        controlUi: {
          allowedOrigins: ["https://openclaw.synergia.net.ar"],
        },
        // Since 2026.9.x the gateway rejects requests that carry X-Forwarded-*
        // headers unless they arrive from a trusted proxy ("Proxy client
        // attribution is required"). The gateway binds to 127.0.0.1 and the
        // socat sidecar relays the Service port to it, so every request -- and
        // Traefik's forwarded headers -- reaches it from 127.0.0.1. socat is a
        // plain TCP relay and never touches headers; the real proxy is Traefik,
        // which by default does not trust client-supplied X-Forwarded-* headers.
        //
        // Scope of trust: anything that can reach the Service could send forged
        // X-Forwarded-For through socat, since nothing restricts ingress to it
        // (flannel enforces no NetworkPolicy). The gateway still refuses to
        // attribute a forwarded request to loopback, so a forged header cannot
        // claim local trust, and token auth still applies. Tighten with a
        // NetworkPolicy once Cilium enforces them.
        trustedProxies: ["127.0.0.1"],
      },

      commands: {
        ownerAllowFrom: ["telegram:535462698"],
      },

      channels: {
        telegram: {
          enabled: true,
          dmPolicy: "allowlist",
          allowFrom: [535462698],
          groupAllowFrom: [535462698],
        }
      },

      // Home Assistant exposes a native MCP Server (core integration, no npm
      // package needed). Without this the agent improvises unauthenticated
      // curl calls against /api/states, which Home Assistant rejects and
      // counts toward an IP ban. ${HA_TOKEN} is expanded from the env at load,
      // so the token stays in the SOPS secret and never lands in Git.
      // Requires the "Model Context Protocol Server" integration enabled in
      // Home Assistant; it only exposes entities marked visible to Assist.
      mcp: {
        servers: {
          "home-assistant": {
            url: "http://home-assistant.tools.svc.cluster.local:8123/mcp_server/sse",
            headers: {
              Authorization: "Bearer ${HA_TOKEN}",
            },
          },
        }
      },

      // Every tool definition ships in the prompt on every turn. Left at the
      // defaults this agent sent ~84k tokens for a one-line message, which
      // exhausted free-tier quotas, pushed Gemini past its 45s response
      // deadline, and gave the model a huge menu to pick the wrong tool from.
      // These plugins carry tools this deployment never uses.
      plugins: {
        deny: [
          "browser",        // headless browsing; no skill here needs it
          "canvas",         // experimental rendering for paired nodes
          "talk-voice",     // Telegram is used as text only
        ],
      },

      // Memory search stays off, as it was on 2026.6.34 (then
      // agents.defaults.memorySearch). 2026.9.x moved the setting here and
      // turns it on by default, which silently re-enabled it after the
      // upgrade: it indexed every session, asked for OpenAI embeddings this
      // deployment has no key for (vector search stuck "paused"), and scheduled
      // memory-core dreaming jobs. Kept out of agents.defaults on purpose: the
      // old key there is rejected by 2026.9.x.
      memory: {
        search: {
          enabled: false,
        },
      },

      agents: {
        defaults: {
          // Allowlist, not denylist: 56 skills load by default and 39 of them
          // cannot even run here (macOS apps, Sonos, Spotify, iMessage...).
          // Anything omitted is simply absent from the prompt.
          skills: [
            "netbox-diagrama-red",
            "netbox-diagrama-red-full-topology",
            "camsnap",
            "diagram-maker",
            "github",
            "summarize",
            "weather",
          ],

          model: {
            // Groq is deliberately absent: its free tier caps at 8k tokens per
            // minute (12k for llama-3.3-70b), well under this agent's base
            // prompt, so every call returned 413 and burned ~70s in retries
            // before failing over. Re-add it only on a paid Groq tier.
            //
            // gemini-2.5-flash and gemini-2.5-flash-lite are retired: Google
            // returns a 404 "no longer available to new users" on every key
            // we've tried, project/billing status doesn't matter.
            // Up to 2026.6.34, OpenClaw's fixed model registry rejected
            // gemini-3.6-flash client-side as "Unknown model". Since 2026.9.x
            // the catalog is discovered per credentialed provider, and
            // gemini-3.6/3.7/3.8-flash are listed (latency not yet measured
            // here). In use: gemini-3.5-flash-lite (fast; free-tier quota is
            // tight, a tool-heavy turn can 429) and gemini-3-flash-preview
            // (preview build, prone to slow responses or 503 "overloaded").
            //
            // Alibaba Qwen (DashScope) was primary for a few days and was
            // removed: the free tier ran out quickly and the account started
            // billing. Groq stays installed and keyed, so it can still be
            // picked by hand, but it stays out of this chain for the reason
            // above.
            primary: "google/gemini-3.5-flash-lite",
            fallbacks: [
              "google/gemini-3-flash-preview",
              "mistral/mistral-small-latest",
            ],
          },
        }
      }
    }
