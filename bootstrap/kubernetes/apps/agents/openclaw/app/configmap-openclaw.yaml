---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: agents
data:
  openclaw.json: |
    {
      gateway: {
        mode: "local",
        auth: {
          mode: "token",
        },
        controlUi: {
          allowedOrigins: ["https://openclaw.synergia.net.ar"],
        },
      },

      commands: {
        ownerAllowFrom: ["telegram:535462698"],
      },

      channels: {
        telegram: {
          enabled: true,
          dmPolicy: "allowlist",
          allowFrom: [535462698],
          groupAllowFrom: [535462698],
        }
      },

      // Home Assistant exposes a native MCP Server (core integration, no npm
      // package needed). Without this the agent improvises unauthenticated
      // curl calls against /api/states, which Home Assistant rejects and
      // counts toward an IP ban. ${HA_TOKEN} is expanded from the env at load,
      // so the token stays in the SOPS secret and never lands in Git.
      // Requires the "Model Context Protocol Server" integration enabled in
      // Home Assistant; it only exposes entities marked visible to Assist.
      mcp: {
        servers: {
          "home-assistant": {
            url: "http://home-assistant.tools.svc.cluster.local:8123/mcp_server/sse",
            headers: {
              Authorization: "Bearer ${HA_TOKEN}",
            },
          },
        }
      },

      // Every tool definition ships in the prompt on every turn. Left at the
      // defaults this agent sent ~84k tokens for a one-line message, which
      // exhausted free-tier quotas, pushed Gemini past its 45s response
      // deadline, and gave the model a huge menu to pick the wrong tool from.
      // These plugins carry tools this deployment never uses.
      plugins: {
        deny: [
          "browser",        // headless browsing; no skill here needs it
          "canvas",         // experimental rendering for paired nodes
          "phone-control",  // no paired phone
          "talk-voice",     // Telegram is used as text only
        ],
      },

      // The bundled "alibaba" plugin only advertises video-generation, so it
      // cannot serve text. DashScope's OpenAI-compatible endpoint is wired up
      // here as a custom provider instead -- "mode: merge" keeps the stock
      // catalog (google/mistral/groq...) and adds these entries on top rather
      // than replacing it.
      //
      // Use the -intl host: the mainland endpoint (dashscope.aliyuncs.com)
      // rejects international account keys with an auth error that reads like
      // a bad key. ${ALIBABA_API_KEY} is expanded from the env at load, so
      // the key stays in the SOPS secret and never lands in Git -- same
      // pattern as ${HA_TOKEN} above.
      models: {
        mode: "merge",
        providers: {
          alibaba: {
            baseUrl: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1",
            apiKey: "${ALIBABA_API_KEY}",
            api: "openai-completions",
            models: [
              {
                id: "qwen3.8-flash",
                name: "Qwen3.8-Flash",
                reasoning: false,
                input: ["text", "image"],
                contextWindow: 131072,
                maxTokens: 8192,
              },
              {
                id: "qwen3.8-max",
                name: "Qwen3.8-Max",
                reasoning: false,
                input: ["text", "image"],
                contextWindow: 131072,
                maxTokens: 8192,
              },
            ],
          },
        },
      },

      agents: {
        defaults: {
          // Allowlist, not denylist: 56 skills load by default and 39 of them
          // cannot even run here (macOS apps, Sonos, Spotify, iMessage...).
          // Anything omitted is simply absent from the prompt.
          skills: [
            "netbox-diagrama-red",
            "netbox-diagrama-red-full-topology",
            "camsnap",
            "diagram-maker",
            "github",
            "summarize",
            "weather",
          ],

          model: {
            // Groq is deliberately absent: its free tier caps at 8k tokens per
            // minute (12k for llama-3.3-70b), well under this agent's base
            // prompt, so every call returned 413 and burned ~70s in retries
            // before failing over. Re-add it only on a paid Groq tier.
            //
            // gemini-2.5-flash and gemini-2.5-flash-lite are retired: Google
            // returns a 404 "no longer available to new users" on every key
            // we've tried, project/billing status doesn't matter.
            // "google/gemini-3.6-flash" is NOT usable here either, despite
            // being Google's suggested replacement: this pinned OpenClaw
            // build (2026.6.34) doesn't have it in its own model registry
            // and rejects it client-side with "Unknown model" before ever
            // calling Google. Confirmed working on this build instead:
            // gemini-3.5-flash-lite (fast, free-tier quota is tight -- a
            // single tool-heavy turn can burn through it and 429) and
            // gemini-3-flash-preview (fallback; preview build, prone to
            // slow responses or 503 "overloaded" under high demand).
            //
            // Qwen3.8-Flash is primary: 128k context clears this agent's base
            // prompt, which is where the Groq free tier failed. The Gemini
            // entries stay as fallbacks so a DashScope outage or quota trip
            // degrades instead of taking the agent down.
            // Trying qwen3.8-max to compare answer quality. Measured latency
            // is no better than flash (~25s vs ~23s mean on a trivial turn,
            // both dominated by reasoning tokens); gemini-3.5-flash-lite does
            // the same turn in ~3.7s. Revert to flash if max does not justify
            // itself on real traffic.
            primary: "alibaba/qwen3.8-max",
            fallbacks: [
              "google/gemini-3.5-flash-lite",
              "google/gemini-3-flash-preview",
              "mistral/mistral-small-latest",
            ],
          },
          memorySearch: {
            enabled: false,
          },
        }
      }
    }
