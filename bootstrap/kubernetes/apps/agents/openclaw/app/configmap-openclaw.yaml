---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: agents
data:
  openclaw.json: |
    {
      gateway: {
        mode: "local",
        auth: {
          mode: "token",
        },
        controlUi: {
          allowedOrigins: ["https://openclaw.synergia.net.ar"],
        },
      },

      commands: {
        ownerAllowFrom: ["telegram:535462698"],
      },

      channels: {
        telegram: {
          enabled: true,
          dmPolicy: "allowlist",
          allowFrom: [535462698],
          groupAllowFrom: [535462698],
        }
      },

      // MCP servers — disabled until correct npm package names are confirmed
      // mcp: {
      //   servers: {
      //     "home-assistant": {
      //       command: "npx",
      //       args: ["-y", "PACKAGE_NAME", "--url", "http://home-assistant.tools.svc.cluster.local:8123", "--token", "${HA_TOKEN}"]
      //     },
      //     "prometheus": {
      //       command: "npx",
      //       args: ["-y", "PACKAGE_NAME", "--url", "http://prometheus-server.monitoring.svc.cluster.local"]
      //     }
      //   }
      // },

      agents: {
        defaults: {
          model: {
            // Groq is deliberately absent: its free tier caps at 8k tokens per
            // minute (12k for llama-3.3-70b), well under this agent's base
            // prompt, so every call returned 413 and burned ~70s in retries
            // before failing over. Re-add it only on a paid Groq tier.
            primary: "google/gemini-flash-latest",
            fallbacks: [
              "google/gemini-3.5-flash",
              "google/gemini-3-flash-lite",
              "mistral/mistral-small-latest",
            ],
          },
          memorySearch: {
            enabled: false,
          },
        }
      }
    }
