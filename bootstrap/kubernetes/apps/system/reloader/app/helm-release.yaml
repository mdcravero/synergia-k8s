---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: reloader
      version: ">=1.0.0"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: kube-system
      interval: 1m
  values:
    reloader:
      watchGlobally: false
