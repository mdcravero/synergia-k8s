---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zigbee2mqtt
  namespace: tools
spec:
  replicas: 1
  strategy:
    # Only one process may hold the Zigbee coordinator's TCP socket
    # (10.42.30.30:6638) at a time. RollingUpdate briefly runs old+new
    # pods together, which both races for that socket and lets the
    # old pod's MQTT disconnect (LWT) overwrite the new pod's correct
    # "online" bridge/state with a stale retained "offline".
    type: Recreate
  selector:
    matchLabels:
      app: zigbee2mqtt
  template:
    metadata:
      labels:
        app: zigbee2mqtt
    spec:
      initContainers:
        - name: init-config
          image: busybox:1.38
          command:
            - sh
            - -c
            - |
              if [ ! -f /app/data/configuration.yaml ]; then
                cp /app/config/configuration.yaml /app/data/configuration.yaml
              fi
          volumeMounts:
            - name: conf-cm
              mountPath: /app/config
              readOnly: true
            - name: data
              mountPath: /app/data
      containers:
        - name: zigbee2mqtt
          image: ghcr.io/koenkk/zigbee2mqtt:2.14.1
          ports:
            - containerPort: 8080
              name: frontend
          env:
            - name: ZIGBEE2MQTT_CONFIG_MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: secret-mosquitto
                  key: username
            - name: ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-mosquitto
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
        - name: bridge-online-healer
          # zigbee2mqtt sometimes fails to republish a retained
          # "online" bridge/state after a restart, leaving every HA
          # entity availability-linked to it stuck "unavailable" even
          # though the bridge is actually up and publishing. Force it.
          image: eclipse-mosquitto:2.0.22
          command:
            - sh
            - -c
            - |
              sleep 20
              for i in $(seq 1 30); do
                mosquitto_pub -h mosquitto.tools.svc.cluster.local -p 1883 \
                  -u "$MQTT_USER" -P "$MQTT_PASSWORD" \
                  -t zigbee2mqtt/bridge/state -m '{"state":"online"}' -r -q 1 \
                  && break
                sleep 5
              done
              sleep infinity
          env:
            - name: MQTT_USER
              valueFrom:
                secretKeyRef:
                  name: secret-mosquitto
                  key: username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-mosquitto
                  key: password
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 32Mi
      volumes:
        - name: conf-cm
          configMap:
            name: zigbee2mqtt-conf
        - name: data
          persistentVolumeClaim:
            claimName: zigbee2mqtt-data
