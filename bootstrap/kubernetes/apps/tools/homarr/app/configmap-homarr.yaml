---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homarr-values
  namespace: tools
data:
  values.yaml: |-
    # Default values for homarr.
    podAnnotations: {}

    rbac:
      enabled: true
    env:
      DEFAULT_COLOR_SCHEME: dark
      TZ: America/Argentina/Cordoba
    fullnameOverride: ""
    # image:
    # # -- Image repository
    # repository: ghcr.io/homarr-labs/homarr
    # # -- Image pull policy
    # pullPolicy: IfNotPresent
    # # -- Overrides the image tag whose default is the chart appVersion
    # tag: "v1.28.0"
    ingress:
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        # traefik.ingress.kubernetes.io/router.middlewares: traefik-middlewares-authelia@kubernetescrd

      enabled: true
      hosts:
        - host: homarr.synergia.net.ar
          paths:
            - path: /
              pathType: Prefix
      className: "traefik"
      tls:
        - hosts:
            - "homarr.synergia.net.ar"
    nameOverride: ""

    service:
      port: 7575
      targetPort: 7575
      type: ClusterIP

    persistence:
      homarrDatabase:
        enabled: true
        name: "homarr-database"
        storageClassName: "nfs-client"
        accessMode: "ReadWriteOnce"
        size: "1Gi"
        mountPath: "/appdata/db"
      homarrTrustedCerts:
        enabled: true
        type: pvc
        name: "homarr-trusted-certificates"
        storageClassName: "nfs-client"
        accessMode: "ReadWriteOnce"
        size: "50Mi"
        mountPath: "/appdata/trusted-certificates"

    envSecrets:
      dbCredentials:
        existingSecret: "secret-homarr-db"


    # The chart defaults (1s timeout, 3 failures 10s apart) are too tight for an
    # RPi4 with the SQLite database on NFS. On every start the iconsUpdater job
    # rewrites ~29k icons, which takes 22-26s over NFS. better-sqlite3 blocks
    # the event loop meanwhile, so the probes timed out. On 2026-10-03 this
    # restarted Homarr 13 times in a row after a node drain. These settings
    # tolerate ~2 minutes of unresponsiveness before a restart.
    livenessProbe:
      httpGet:
        # -- This is the liveness check endpoint used by Kubernetes to determine if the application is still running.
        path: /api/health/live
        # -- The port on which the liveness check will be performed. This must be the same as the container port exposed by the application.
        port: 7575
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6

    readinessProbe:
      httpGet:
        path: /api/health/ready
        port: 7575
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
