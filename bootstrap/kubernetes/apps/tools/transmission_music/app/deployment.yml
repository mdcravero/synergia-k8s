apiVersion: apps/v1
kind: Deployment
metadata:
  name: trans-music
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trans-music
  template:
    metadata:
      labels:
        app: trans-music
    spec:
      # linuxserver.io non-root mode (the image supports it): start as the
      # app user instead of root. PUID/PGID have no effect in this mode;
      # the uid/gid match them and /config's owner. s6 needs a writable /run
      # (the emptyDir below), and LSIO_NON_ROOT_USER selects the mode.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trans-music
          image: "lscr.io/linuxserver/transmission:4.1.3"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 15m
              memory: 112Mi
            limits:
              cpu: 200m
              memory: 128Mi
          ports:
            - containerPort: 9091
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Argentina/Cordoba"
            # The image detects non-root mode from /run's owner, and an
            # emptyDir is always owned by root, so set the flag the
            # detection would set. Without it, init takes the root path
            # (usermod, chown, s6-setuidgid) and the app never starts.
            - name: LSIO_NON_ROOT_USER
              value: "1"
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: secret-transmission-music
                  key: username
            - name: PASS
              valueFrom:
                secretKeyRef:
                  name: secret-transmission-music
                  key: password
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: run
              mountPath: /run
      volumes:
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: config
          persistentVolumeClaim:
            claimName: trans-music-config
        - name: downloads
          persistentVolumeClaim:
            claimName: trans-music-down
