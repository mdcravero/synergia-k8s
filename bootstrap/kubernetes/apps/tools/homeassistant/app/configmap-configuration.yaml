---
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-configuration
  namespace: tools
data:
  configuration.yaml: |
    # Loads default set of integrations. Do not remove.
    default_config:

    # Load frontend themes from the themes folder
    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    # http: block removed — HA 2026.8 deprecated YAML-based http config and
    # auto-imported use_x_forwarded_for/trusted_proxies into UI storage
    # (Settings > System > Network). It stops working entirely in 2027.2.0.
    # Values now live in .storage/http on the NFS PVC, outside Git — the one
    # tradeoff of following HA's own migration path here.

    recorder:
      db_url: !env_var POSTGRES_URL
      # Automation/update churn has no analytic value and inflates the DB fastest
      # as more IoT devices get added.
      exclude:
        domains:
          - automation
          - update
