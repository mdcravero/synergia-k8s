apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-token
  namespace: flux-system
stringData:
  # Replace with a random token (e.g. `openssl rand -hex 32`), then encrypt
  # this file with `sops --encrypt --in-place` BEFORE committing.
  # The same token must be set as the secret in the GitHub webhook config.
  token: REPLACE_WITH_GENERATED_TOKEN
